name: Web App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Get application code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate web page
        run: python tests/check_html.py

      - name: Package release artifact
        run: tar -czf web-app-${{ github.sha }}.tar.gz -C app .

      - name: Save release artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-${{ github.sha }}
          path: web-app-${{ github.sha }}.tar.gz
